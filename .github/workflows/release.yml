name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: perform verification and packaging checks without publishing to npm"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release Gate — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 24
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 24

      - name: Ensure tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_versions.py --tag "${{ github.ref_name }}"

      - name: Ensure tag commit is on main branch
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: release tag commit must be an ancestor of origin/main"
            exit 1
          fi

      - name: Python compile check
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for path in [*pathlib.Path('scripts').glob('*.py'), *pathlib.Path('tests').glob('*.py')]]"

      - name: Run unit test suite
        run: python -m unittest discover -s tests

      - name: Verify release status fixture
        run: python scripts/ci_status_fixture.py

      - name: Check package contents dry-run
        run: python scripts/check_package.py

      - name: Run npm smoke test
        run: python scripts/smoke_npm_install.py

  publish:
    name: Publish to npm (Staged OIDC)
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm CLI for staged publishing
        run: |
          npm install --global 'npm@^11.15.0'
          node --version
          npm --version

      - name: Verify package contents before publish
        run: python scripts/check_package.py

      - name: Publish package to npm
        run: |
          # Default: stage publication on npm (requires maintainer 2FA approval on npmjs.com).
          # To switch to direct publish without staging, change 'npm stage publish' to 'npm publish':
          npm stage publish --access public

  draft-release:
    name: Create Draft GitHub Release
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 24

      - name: Build release tarball
        id: pack
        run: |
          tarball="$(npm pack)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          tag="${{ github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pack.outputs.tag }}"
          tarball="${{ steps.pack.outputs.tarball }}"
          notes_file="docs/release-notes/0.3.0.md"
          notes_flag=""
          if [ -f "${notes_file}" ]; then
            notes_flag="--notes-file ${notes_file}"
          else
            notes_flag="--generate-notes"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${tarball}" --clobber
          else
            gh release create "${tag}" "${tarball}" --draft --verify-tag ${notes_flag}
          fi
